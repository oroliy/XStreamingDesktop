name: Go client

on:
  push:
    paths:
      - 'go-client/**'
      - '.github/workflows/go-client.yml'
  pull_request:
    paths:
      - 'go-client/**'
      - '.github/workflows/go-client.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-client/go.mod
          cache-dependency-path: go-client/go.sum
      - run: go test -race ./...
      - run: go vet ./...
  cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: windows, goarch: amd64}
          - {goos: darwin, goarch: amd64}
          - {goos: darwin, goarch: arm64}
    defaults:
      run:
        working-directory: go-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-client/go.mod
          cache-dependency-path: go-client/go.sum
      - name: Build preview binary
        run: |
          mkdir -p "$RUNNER_TEMP/go-client"
          if [ "$GOOS" = windows ]; then
            binary="xstreaming.exe"
            go build -ldflags=-H=windowsgui -o "$RUNNER_TEMP/go-client/$binary" ./cmd/xstreaming
          else
            binary="xstreaming"
            go build -o "$RUNNER_TEMP/go-client/$binary" ./cmd/xstreaming
          fi
          cp README.md README.zh_CN.md "$RUNNER_TEMP/go-client/"
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
      - uses: actions/upload-artifact@v4
        with:
          name: xstreaming-go-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ runner.temp }}/go-client/
          if-no-files-found: error
          retention-days: 14
